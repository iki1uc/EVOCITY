:root {
  --bg: #07080e;
  --surface: #0c0e17;
  --surface2: #12141f;
  --ink: #ede8da;
  --muted: #a49d8f;
  --accent: #f2a93b;
  --accent-soft: rgba(242, 169, 59, 0.13);
  --violet: #8b7ff0;
  --line: rgba(237, 232, 218, 0.13);
}
@media (prefers-color-scheme: dark) {
  --bg: #05060a;
  --surface: #0a0c14;
  --surface2: #10121d;
  --ink: #f0ebdd;
  --muted: #a8a294;
  --accent: #f5ae3a;
  --accent-soft: rgba(245, 174, 58, 0.13);
  --violet: #9788ff;
  --line: rgba(240, 235, 221, 0.13);
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
}
.mono {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
}
::-moz-selection {
  background: var(--accent);
  color: #0a0803;
}
::selection {
  background: var(--accent);
  color: #0a0803;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes spinRev {
  to {
    transform: rotate(-360deg);
  }
}
@keyframes twinkle {
  0%, 100% {
    opacity: 0.15;
  }
  50% {
    opacity: 0.95;
  }
}
@keyframes pulseGlow {
  0%, 100% {
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
}
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.spin-slow {
  animation: spin 48s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.spin-rev {
  animation: spinRev 72s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.twinkle {
  animation: twinkle 3.4s ease-in-out infinite;
}
.pulse-glow {
  animation: pulseGlow 2.8s ease-in-out infinite;
}
.rise-in {
  animation: riseIn 0.7s ease both;
}
/* LVL slider */
input[type='range'].lvl-range {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
input[type='range'].lvl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  border: 4px solid #0a0803;
  box-shadow: 0 0 0 2px var(--accent), 0 0 22px rgba(242, 169, 59, 0.75);
  cursor: grab;
}
input[type='range'].lvl-range::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: 4px solid #0a0803;
  box-shadow: 0 0 0 2px var(--accent), 0 0 22px rgba(242, 169, 59, 0.75);
  cursor: grab;
}
input[type='range'].lvl-range::-moz-range-track {
  height: 8px;
  border-radius: 9999px;
  background: transparent;
}
input[type='number'].lvl-input {
  -moz-appearance: textfield;
  -webkit-appearance: textfield;
          appearance: textfield;
}
input[type='number'].lvl-input::-webkit-outer-spin-button,
input[type='number'].lvl-input::-webkit-inner-spin-button {

  margin: 0;
}
